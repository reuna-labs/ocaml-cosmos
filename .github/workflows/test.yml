name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # The oracles first: if the fixtures have drifted, everything downstream is
  # being checked against the wrong answer.
  #
  # None of these needs a private dependency, so unlike `build` they run
  # whether or not REUNA_CI_TOKEN is set. That is the point of keeping the
  # conformance inputs free of the fork closure.
  conformance:
    runs-on: [self-hosted, Linux, X64, reuna-builder-x86]
    steps:
      - uses: actions/checkout@v4

      # The pin document is only worth having if it describes the tree that is
      # actually there. Checked before anything is regenerated from it.
      - name: The vendored protos must match their recorded hashes
        run: python3 .github/check-proto-pin.py

      # protoc: the reference implementation of the wire format.
      #
      # Downloaded to a runner-temp prefix and hash-verified rather than
      # installed: the org runner deliberately provides no passwordless sudo,
      # which is the same reason ocaml-solana builds its own GMP. The version
      # is pinned because the committed fixtures were produced with it, and a
      # different protoc regenerating them would be testing the wrong thing.
      - name: protoc, without host privileges
        env:
          PROTOC_VERSION: "36.0"
          PROTOC_SHA256: bc8211ce760bd43ee21ddc145d6d9dbaeeabae205267a79d9054a240e367d4b4
        run: |
          archive="$RUNNER_TEMP/protoc.zip"
          prefix="$RUNNER_TEMP/protoc"
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --output "$archive" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v$PROTOC_VERSION/protoc-$PROTOC_VERSION-linux-x86_64.zip"
          echo "$PROTOC_SHA256  $archive" | sha256sum --check --strict
          unzip -q -o "$archive" -d "$prefix"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Regenerate the protoc fixtures
        run: |
          protoc --version
          conformance/protoc/generate.sh

      # The Go SDK: the reference implementation of the protocol, and the only
      # authority on amino JSON.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Regenerate the Go SDK fixtures, and cross-check against protoc
        run: conformance/simd/generate.sh

      # CosmJS: what the ecosystem's wallets actually run. A library that
      # matched the SDK and disagreed with this would be correct and unusable.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Regenerate the CosmJS fixtures, and cross-check against both
        run: conformance/cosmjs/generate.sh

      # A generator that no longer reproduces the committed bytes means either
      # an SDK changed or we did. Either way it is not something to discover at
      # release time.
      - name: The fixtures must not have moved
        run: git diff --exit-code conformance/fixtures/

  build:
    runs-on: [self-hosted, Linux, X64, reuna-builder-x86]
    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler: ["4.14.2", "5.2.1"]
    steps:
      - uses: actions/checkout@v4

      # Six of this repository's dependencies live in private reuna-labs
      # repositories -- the mirage-crypto fork for P256k1, the digestif fork,
      # and the two web3-codec packages -- and the runner has no git credential
      # for github.com by default. Without one, `opam pin` fails with
      #
      #   fatal: could not read Username for 'https://github.com'
      #
      # This check is FIRST, before setup-ocaml, on purpose: a run that cannot
      # succeed should cost five seconds rather than the thirty-five minutes
      # setup-ocaml spends building a compiler before reaching the pin step.
      #
      # To turn the build on, add a token with read access to reuna-labs as the
      # repository secret REUNA_CI_TOKEN. Nothing else changes.
      #
      # That the credential is needed at all is the G0 launch gate -- "no opam
      # file points to a private repository" -- and it is not closed. See
      # docs/release.md.
      #
      # The conformance job deliberately needs none of this, so the oracles are
      # checked on every push whether or not the build can run.
      - name: Are the private dependencies reachable?
        id: creds
        env:
          TOKEN: ${{ secrets.REUNA_CI_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Build skipped::REUNA_CI_TOKEN is not set, so the private pins (mirage-crypto fork, digestif fork, web3-codec) cannot be fetched. The conformance job still runs, and needs nothing private. See .github/workflows/test.yml."
          fi

      - name: Let git reach the private remotes
        if: steps.creds.outputs.ok == 'true'
        env:
          TOKEN: ${{ secrets.REUNA_CI_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - uses: ocaml/setup-ocaml@v3
        if: steps.creds.outputs.ok == 'true'
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          opam-local-packages: "*.opam"
          # The runner deliberately provides no passwordless sudo, so opam
          # cannot set up its bubblewrap sandbox. ocaml-solana does the same.
          opam-disable-sandboxing: true

      # The offline core has no GMP dependency; test/no_io_guard.sh below
      # enforces that boundary. The Unix TLS adapter does use
      # mirage-crypto-pk, however, whose native build needs GMP. Build a
      # hash-verified private prefix because the runner deliberately has no
      # passwordless sudo. This supplies only the outer adapter build and does
      # not add GMP to the core package closure.
      - name: Build the GMP prerequisite for TLS without host privileges
        if: steps.creds.outputs.ok == 'true'
        env:
          GMP_VERSION: "6.3.0"
          GMP_SHA256: a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898
        run: |
          archive="$RUNNER_TEMP/gmp-$GMP_VERSION.tar.xz"
          source_dir="$(mktemp --directory "$RUNNER_TEMP/gmp-build.XXXXXX")"
          gmp_prefix="$RUNNER_TEMP/ocaml-cosmos-gmp-${{ matrix.ocaml-compiler }}"
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --output "$archive" \
            "https://ftp.gnu.org/gnu/gmp/gmp-$GMP_VERSION.tar.xz"
          echo "$GMP_SHA256  $archive" | sha256sum --check --strict
          tar --extract --xz --file "$archive" --directory "$source_dir" --strip-components 1
          cd "$source_dir"
          ./configure --prefix="$gmp_prefix" --with-pic
          make -j"$(nproc)"
          make install
          echo "CPATH=$gmp_prefix/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$gmp_prefix/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$gmp_prefix/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$gmp_prefix/lib/pkgconfig" >> "$GITHUB_ENV"

      # The forks. mirage-crypto-ec is not optional and not substitutable:
      # Mirage_crypto_ec.P256k1 is a Reuna fork addition and released
      # mirage-crypto-ec has no secp256k1 at all, so without this the build
      # fails with "Unbound module P256k1" -- which reads like a typo rather
      # than a missing pin. digestif is pinned for RIPEMD-160 and the 1.4
      # series.
      #
      # These are private repositories. If this step fails to fetch, that is
      # the G0 launch gate showing itself -- "no opam file points to a private
      # repository" -- and not a workflow bug. See docs/release.md.
      - name: Pin the crypto forks
        if: steps.creds.outputs.ok == 'true'
        run: |
          M=git+https://github.com/reuna-labs/mirage-crypto.git#v2.4.0-reuna1
          opam pin add -yn mirage-crypto.dev "$M"
          opam pin add -yn mirage-crypto-rng.dev "$M"
          opam pin add -yn mirage-crypto-ec.dev "$M"
          # tls depends on mirage-crypto-pk. It must have the same version as
          # the forked mirage-crypto packages rather than opam's release.
          opam pin add -yn mirage-crypto-pk.dev "$M"
          opam pin add -yn digestif.dev \
            git+https://github.com/reuna-labs/digestif.git#v1.4.0-alpha1

      # The lean codec packages are now on main; keeping the branch explicit
      # makes this private staging dependency reproducible until it is tagged.
      - name: Pin the sibling packages
        if: steps.creds.outputs.ok == 'true'
        run: |
          B=git+https://github.com/reuna-labs/ocaml-web3-codec.git#v0.1.0-alpha1
          opam pin add -yn web3-codec-bech32.dev "$B"
          opam pin add -yn web3-codec-protobuf.dev "$B"

      - if: steps.creds.outputs.ok == 'true'
        run: opam install -y --assume-depexts --deps-only --with-test .

      # Formatting is a repository check rather than a package dependency, so
      # --deps-only does not install it. Keep this aligned with .ocamlformat.
      - if: steps.creds.outputs.ok == 'true'
        run: opam install -y ocamlformat.0.29.0

      - if: steps.creds.outputs.ok == 'true'
        run: opam exec -- dune build @install

      - if: steps.creds.outputs.ok == 'true'
        run: opam exec -- dune runtest

      # The offline closure carries no I/O and no GMP, checked from the
      # declared dependencies and then proved by linking.
      - name: The offline closure stays offline
        if: steps.creds.outputs.ok == 'true'
        run: opam exec -- ./test/no_io_guard.sh

      - name: Formatting
        if: steps.creds.outputs.ok == 'true'
        run: opam exec -- dune build @fmt
