name: test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, reuna-builder-x86]
    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler: ["4.14.2", "5.2.1"]
    steps:
      - uses: actions/checkout@v4

      # Six of this repository's dependencies live in private reuna-labs
      # repositories -- the mirage-crypto fork for P256k1, the digestif fork,
      # and the two web3-codec packages -- and the runner has no git credential
      # for github.com by default. Without one, `opam pin` fails with
      #
      #   fatal: could not read Username for 'https://github.com'
      #
      # This check is FIRST, before setup-ocaml, on purpose: a run that cannot
      # succeed should cost five seconds rather than the thirty-five minutes
      # setup-ocaml spends building a compiler before reaching the pin step.
      #
      # To turn the build on, add a token with read access to reuna-labs as the
      # repository secret REUNA_CI_TOKEN. Nothing else changes.
      #
      # That the credential is needed at all is the G0 launch gate -- "no opam
      # file points to a private repository" -- and it is not closed. See
      # docs/release.md.
      - name: Are the private dependencies reachable?
        id: creds
        env:
          TOKEN: ${{ secrets.REUNA_CI_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Build skipped::REUNA_CI_TOKEN is not set, so the private pins (mirage-crypto fork, digestif fork, web3-codec) cannot be fetched. proto-pin still runs. See .github/workflows/test.yml."
          fi

      - name: Let git reach the private remotes
        if: steps.creds.outputs.ok == 'true'
        env:
          TOKEN: ${{ secrets.REUNA_CI_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - uses: ocaml/setup-ocaml@v3
        if: steps.creds.outputs.ok == 'true'
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          opam-local-packages: "*.opam"
          # The runner deliberately provides no passwordless sudo, so opam
          # cannot set up its bubblewrap sandbox. ocaml-solana does the same.
          opam-disable-sandboxing: true

      # No GMP step here, deliberately. ocaml-tron's workflow builds a
      # hash-verified GMP prefix because zarith is unavoidable in its closure;
      # this one has no zarith at all, and test/no_io_guard.sh below is what
      # keeps that true.

      # The forks. mirage-crypto-ec is not optional and not substitutable:
      # Mirage_crypto_ec.P256k1 is a Reuna fork addition and released
      # mirage-crypto-ec has no secp256k1 at all, so without this the build
      # fails with "Unbound module P256k1" -- which reads like a typo rather
      # than a missing pin. digestif is pinned for RIPEMD-160 and the 1.4
      # series.
      #
      # These are private repositories. If this step fails to fetch, that is
      # the G0 launch gate showing itself -- "no opam file points to a private
      # repository" -- and not a workflow bug. See docs/release.md.
      - name: Pin the crypto forks
        if: steps.creds.outputs.ok == 'true'
        run: |
          M=git+https://github.com/reuna-labs/mirage-crypto.git#toolchain/ocaml-5.5
          opam pin add -yn mirage-crypto.dev "$M"
          opam pin add -yn mirage-crypto-rng.dev "$M"
          opam pin add -yn mirage-crypto-ec.dev "$M"
          opam pin add -yn digestif.dev \
            git+https://github.com/reuna-labs/digestif.git#toolchain/ocaml-5.5

      # Both live on feat/multiformats, not on the default branch. Naming the
      # branch is not optional: a pin without it resolves to main, which has
      # neither package, and the failure is a confusing "unknown package"
      # rather than a missing branch.
      - name: Pin the sibling packages
        if: steps.creds.outputs.ok == 'true'
        run: |
          B=git+https://github.com/reuna-labs/ocaml-web3-codec.git#feat/multiformats
          opam pin add -yn web3-codec-bech32.dev "$B"
          opam pin add -yn web3-codec-protobuf.dev "$B"

      - if: steps.creds.outputs.ok == 'true'
        run: opam install -y --assume-depexts --deps-only --with-test .

      - if: steps.creds.outputs.ok == 'true'
        run: opam exec -- dune build @install

      - if: steps.creds.outputs.ok == 'true'
        run: opam exec -- dune runtest

      # The offline closure carries no I/O and no GMP, checked from the
      # declared dependencies and then proved by linking.
      - name: The offline closure stays offline
        if: steps.creds.outputs.ok == 'true'
        run: opam exec -- ./test/no_io_guard.sh

      - name: Formatting
        if: steps.creds.outputs.ok == 'true'
        run: opam exec -- dune build @fmt

  # The generated bindings are committed. Regenerating them must reproduce
  # exactly what is in the tree, or the pin in docs/protocol-pin.md is a
  # description of something that is no longer there.
  proto-pin:
    runs-on: [self-hosted, Linux, X64, reuna-builder-x86]
    steps:
      - uses: actions/checkout@v4

      - name: The vendored protos must match their recorded hashes
        run: |
          python3 - <<'PY'
          import hashlib, io, os, re, sys
          doc = io.open("docs/protocol-pin.md", encoding="utf-8").read()
          recorded = dict(re.findall(r"^\| `([^`]+\.proto)` \| `([0-9a-f]{64})` \|$",
                                     doc, re.M))
          bad = 0
          seen = set()
          for root, _, names in os.walk("proto"):
              for n in names:
                  if not n.endswith(".proto"):
                      continue
                  p = os.path.join(root, n)
                  rel = os.path.relpath(p, "proto")
                  seen.add(rel)
                  h = hashlib.sha256(io.open(p, "rb").read()).hexdigest()
                  if recorded.get(rel) != h:
                      print("MISMATCH %s" % rel); bad += 1
          for rel in set(recorded) - seen:
              print("RECORDED BUT ABSENT %s" % rel); bad += 1
          sys.exit(1 if bad else 0)
          PY
