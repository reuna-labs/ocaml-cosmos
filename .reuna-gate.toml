# reuna-gate configuration; see ~/reuna/infra/gates/README.md.

[secrets]
# A go.sum is module checksums, not credentials, and takes no comments to
# carry an in-line ignore. trufflehog's Roaring detector matches the
# github.com/RoaringBitmap/roaring hash line in the simd oracle's go.sum.
exclude = ['^conformance/simd/go\.sum$']

[ocaml]
# Not a code finding: the switch this repository builds in cannot run the
# tests. Re-enable once reuna-5.5 is restored additively (see ~/reuna/AGENTS.md,
# Gotchas); formatting is still checked, by [extra] below.
enabled = false
reason = "reuna-5.5 lacks mirage-crypto-secp256k1, so dune build @runtest cannot build; @fmt runs from [extra]"

[extra]
quick = ["opam exec -- dune build @fmt"]

[go.govulncheck-ignore]
# Waiting on upstream, by decision (2026-10-10). The simd conformance oracle
# reaches golang.org/x/crypto/openpgp only through cosmos-sdk's crypto/armor.go,
# which still imports it in v0.55.0, the latest release. openpgp itself is
# frozen and will not be fixed, so this clears when the SDK drops it; the gate
# reports this entry as stale the moment that happens. The oracle generates
# test fixtures and ships in nothing.
"GO-2026-5932" = "x/crypto/openpgp via cosmos-sdk v0.55.0 crypto/armor.go; waiting for the SDK to drop it; test-fixture oracle only"
